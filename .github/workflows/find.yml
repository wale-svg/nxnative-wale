name: find-service
on: [push, workflow_dispatch]

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: no-bc

      - name: Debugging docs and tools
        run: |
          echo "=== docs/agents/README.md ==="
          sed -n 1,150p docs/agents/README.md
          echo "=== scripts ==="
          ls scripts
          echo "=== symbolizing tools ==="
          grep -rIn -i -E "symboli[sz]e|addr2sym|sdk\+0x" scripts docs | head -40
          echo "=== Splatoon 2 profile ==="
          ls -la dm/games/0100F8F0000A2000 2>&1
          sed -n 1,80p dm/games/0100F8F0000A2000/README.md 2>&1
          echo "=== HLE_FORCE macro ==="
          grep -n -B2 -A10 "define HLE_FORCE" dm/host/hle.h
