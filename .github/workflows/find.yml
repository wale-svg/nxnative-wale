name: find-service
on: [push, workflow_dispatch]

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: no-bc

      - name: Show the applet/capture code
        run: |
          echo "=== hle_oe.c lines 290-380 ==="
          sed -n 290,380p dm/host/hle_oe.c
          echo "=== capture / album / grc mentions ==="
          grep -rn -i -E "capture|album|grc|applet proxy" dm/host/hle_oe.c | head -40
          echo "=== hle_offline.c header ==="
          sed -n 1,60p dm/host/hle_offline.c
